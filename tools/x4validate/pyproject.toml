[project]
name = "x4validate"
version = "2.5.0"
description = "X4 Foundations cross-file XML diff/reference/completeness validator"
requires-python = ">=3.13"
dependencies = ["lxml>=5.0", "ruamel.yaml>=0.18"]

[project.scripts]
x4validate = "x4validate._cli:main"
x4modlist = "x4validate._modlist:main"
x4compat = "x4validate._compat:main"
x4xref = "x4validate._xref:main"
x4stats = "x4validate._stats:main"
x4similar = "x4validate._similarity:main"
x4effective = "x4validate._effective:main"
x4diff = "x4validate._diff:main"
x4debug = "x4validate._debugcli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x4validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
